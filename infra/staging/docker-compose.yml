# Staging stack for ONE small server (a VM with a public IP and a DNS name).
#   - api    the backend, built from ../../backend
#   - redis  shared rate-limit counts and live-event fan-out (optional but included)
#   - caddy  HTTPS (certificates are fetched and renewed automatically) in front of the api;
#            WebSockets (live tracking) pass through without extra settings
# MongoDB is NOT here: use MongoDB Atlas (a replica set) and put its address in .env.staging.
#
# Usage (from this folder):  see docs/staging-deploy.md
#   cp env.staging.example .env.staging        # fill it in (it is git-ignored)
#   docker compose --env-file .env.staging up -d --build
services:
  api:
    build:
      context: ../../backend
    env_file: .env.staging
    environment:
      NODE_ENV: staging
      PORT: "4000"
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
    volumes:
      # Driver documents (STORAGE_DRIVER=local). Back this volume up: losing it loses the files.
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Stop politely: the server drains requests for up to 10 s on SIGTERM.
    stop_grace_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.staging (the DNS name of this server)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uploads:
  redis-data:
  caddy-data:
  caddy-config:
